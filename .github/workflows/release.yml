name: Native Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: wrosecode-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: wrosecode-linux-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: wrosecode-darwin-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: wrosecode-darwin-aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: wrosecode-windows-x86_64.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: wrosecode-windows-aarch64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag and package versions match
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) { console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${p.version}`); process.exit(1); }'
          node -e 'const p=require("./package.json"); const c=require("fs").readFileSync("Cargo.toml","utf8"); if (!new RegExp(`^version\\s*=\\s*"${p.version.replaceAll(".","\\.")}"$`,"m").test(c)) { console.error("Cargo.toml version does not match package.json"); process.exit(1); }'
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Name binary and create checksum
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/wrosecode.exe" "dist/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/wrosecode" "dist/${{ matrix.asset }}"
          fi
          sha256sum "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
      - name: Upload release assets for aggregation
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Download all native binaries and checksums
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release set and checksums
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            wrosecode-linux-x86_64
            wrosecode-linux-aarch64
            wrosecode-darwin-x86_64
            wrosecode-darwin-aarch64
            wrosecode-windows-x86_64.exe
            wrosecode-windows-aarch64.exe
          )
          for asset in "${assets[@]}"; do
            test -s "release-assets/$asset"
            test -s "release-assets/$asset.sha256"
            (cd release-assets && sha256sum --check "$asset.sha256")
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 12
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "WROSECODE $tag" --notes "Native WROSECODE binaries for Linux, macOS, and Windows (x86_64 and aarch64). Each binary is accompanied by a SHA-256 checksum."
          fi
          gh release upload "$tag" release-assets/* --clobber
