name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Validate npm package scripts
        run: npm run check

      - name: Validate npm package contents
        run: npm pack --dry-run --json

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Shell and process integration suites require POSIX semantics.
      # Windows still compiles every test target and runs build/Clippy checks.
      - name: Run Rust tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: cargo test --all-targets

      - name: Compile Rust test suite (Windows)
        if: runner.os == 'Windows'
        run: cargo test --all-targets --no-run

      - name: Run release benchmark regression tests (Linux and macOS)
        if: runner.os != 'Windows'
        run: cargo test --release benchmarks -- --nocapture

      - name: Build release binary
        run: cargo build --release --locked
