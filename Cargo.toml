[package]
name = "wrosecode"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Terminal coding agent with explicit tool permissions"

[dependencies]
anyhow = "=1.0.100"
async-trait = "=0.1.89"
clap = { version = "=4.5.48", features = ["derive"] }
crossterm = "=0.29.0"
futures = "=0.3.31"
globset = "=0.4.16"
regex = "=1.12.2"
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml = "=0.9.34"
syn = { version = "=2.0.119", features = ["full", "parsing"] }
toml = "=1.1.6"
toml_edit = "=0.25.15"
keyring = { version = "=3.6.1", default-features = false, features = ["linux-native"] }
tokio = { version = "=1.47.1", features = ["full"] }
walkdir = "=2.5.0"
axum = { version = "=0.8.9", features = ["json"] }
base64 = "=0.23.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
